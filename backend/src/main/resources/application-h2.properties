# ===================================================================
# In-Memory H2 Profile for Instant Offline Viva Demonstration
# Run with: java -jar target/sudha-cafe-backend-1.0.0.jar --spring.profiles.active=h2
# ===================================================================

spring.datasource.url=jdbc:h2:mem:sudha_cafe;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
