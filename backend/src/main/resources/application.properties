# ===================================================================
# Sudha Cafe - Spring Boot Application Configuration
# BCA 5th Semester Minor Project
# ===================================================================

server.port=8080

# Spring Application Name
spring.application.name=sudha-cafe-backend

# ===================================================================
# MySQL Database Connection Settings
# Configure via Environment Variables or modify below for local setup:
#   DB_HOST (default: localhost)
#   DB_PORT (default: 3306)
#   DB_NAME (default: sudha_cafe)
#   DB_USERNAME (default: root)
#   DB_PASSWORD (default: empty or set in your environment)
# ===================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sudha_cafe}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA & Hibernate Settings
# update: automatically validates & creates missing tables/columns
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Dialect is automatically resolved by Spring Boot / Hibernate based on datasource

# Enable SQL script initialization if needed
spring.sql.init.mode=never

# ===================================================================
# Jackson JSON Serializer Configuration
# ===================================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata
